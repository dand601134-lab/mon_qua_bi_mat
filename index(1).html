<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trang của tôi</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f7f3ff, #e1f5fe);
      color: #1f2937;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }

    .card {
      background: white;
      max-width: 700px;
      width: 90%;
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.1);
      text-align: center;
    }

    h1 {
      margin-top: 0;
    }

    video {
      width: 100%;
      max-width: 640px;
      margin-top: 20px;
      border-radius: 16px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Trang demo của tôi</h1>
    <p>Đây là trang web đầu tiên của tôi.</p>

    <video controls autoplay muted>
      <source src="./video/video-cua-toi.mp4" type="video/mp4">
      Trình duyệt của bạn không hỗ trợ video.
    </video>
  </div>
</body>
</html>
