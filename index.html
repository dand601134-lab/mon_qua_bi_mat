<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090b14" />
  <title>Trang bí mật của tôi</title>

  <link rel="stylesheet" href="./css/start-screen.css">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #1f2937;
      background: linear-gradient(135deg, #f7f3ff, #e1f5fe);
    }

    .page-content {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .page-content[hidden],
    #password-gate[hidden] {
      display: none !important;
    }

    .card {
      width: min(700px, 100%);
      padding: 32px;
      border-radius: 20px;
      background: white;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    h1 {
      margin-top: 0;
    }

    video {
      display: block;
      width: 100%;
      max-width: 640px;
      margin: 20px auto 0;
      border-radius: 16px;
    }

    #rotate-device-warning {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 99999;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: white;
      background: #172033;
      text-align: center;
    }

    .warning-content {
      max-width: 420px;
    }

    @media screen and (max-width: 768px) and (orientation: portrait) {
      #rotate-device-warning {
        display: flex;
      }
    }

    @keyframes rotateAnim {
      0%, 20% { transform: rotate(0deg); }
      50%, 70% { transform: rotate(90deg); }
      100% { transform: rotate(0deg); }
    }

    #password-gate {
      position: fixed;
      inset: 0;
      z-index: 99998;
      display: grid;
      place-items: center;
      overflow: auto;
      padding: 24px;
      color: #f8f4e8;
      text-align: center;
      background:
        radial-gradient(ellipse at 50% 40%, rgba(84, 61, 132, 0.28), transparent 55%),
        radial-gradient(ellipse at 15% 85%, rgba(35, 120, 132, 0.16), transparent 45%),
        #090b14;
    }

    #password-gate::before,
    #password-gate::after {
      position: absolute;
      z-index: -1;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      content: "";
      filter: blur(75px);
      opacity: 0.45;
      pointer-events: none;
      animation: glow-drift 7s ease-in-out infinite alternate;
    }

    #password-gate::before {
      top: 8%;
      left: 8%;
      background: #7c3aed;
    }

    #password-gate::after {
      right: 8%;
      bottom: 8%;
      background: #0e7490;
      animation-delay: -3s;
    }

    @keyframes glow-drift {
      from { transform: translate3d(-12px, -8px, 0) scale(0.9); }
      to { transform: translate3d(18px, 12px, 0) scale(1.12); }
    }

    .password-card {
      position: relative;
      width: min(430px, 100%);
      padding: 36px 28px 28px;
      overflow: hidden;
      border: 1px solid rgba(238, 210, 139, 0.36);
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(30, 32, 48, 0.97), rgba(15, 17, 29, 0.98));
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.04) inset,
        0 0 32px rgba(164, 120, 255, 0.2),
        0 24px 80px rgba(0, 0, 0, 0.58);
      animation: card-appear 650ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .password-card::before {
      position: absolute;
      top: 0;
      left: 12%;
      width: 76%;
      height: 1px;
      background: linear-gradient(90deg, transparent, #f4d58d, transparent);
      content: "";
      opacity: 0.9;
    }

    @keyframes card-appear {
      from { opacity: 0; transform: translateY(14px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .lock-emblem {
      display: grid;
      width: 68px;
      height: 68px;
      margin: 0 auto 18px;
      place-items: center;
      border: 1px solid rgba(244, 213, 141, 0.6);
      border-radius: 50%;
      background: rgba(244, 213, 141, 0.08);
      box-shadow: 0 0 24px rgba(244, 213, 141, 0.16);
      font-size: 30px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #e8cc8d;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .password-card h2 {
      margin: 0;
      color: #fffaf0;
      font-size: clamp(23px, 6vw, 29px);
      letter-spacing: 1px;
    }

    .intro {
      margin: 12px 0 24px;
      color: #c5c6d2;
      font-size: 14px;
      line-height: 1.6;
    }

    .password-card label {
      display: block;
      margin-bottom: 9px;
      color: #e8cc8d;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-align: left;
      text-transform: uppercase;
    }

    .password-input-wrap {
      position: relative;
    }

    .password-card input {
      width: 100%;
      min-height: 52px;
      padding: 12px 14px;
      border: 1px solid rgba(221, 210, 180, 0.32);
      border-radius: 12px;
      outline: none;
      background: rgba(7, 9, 17, 0.75);
      color: #fffaf0;
      font: inherit;
      font-size: 17px;
      letter-spacing: 2px;
      text-align: center;
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }

    .password-card input::placeholder {
      color: #777989;
      font-size: 14px;
      letter-spacing: 0;
    }

    .password-card input:focus {
      border-color: #e8cc8d;
      box-shadow: 0 0 0 3px rgba(232, 204, 141, 0.12), 0 0 20px rgba(232, 204, 141, 0.12);
    }

    .small-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 9px;
    }

    .small-actions button {
      padding: 6px 10px;
      border: 1px solid rgba(221, 210, 180, 0.2);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      color: #c7c8d2;
      font: inherit;
      font-size: 11px;
      cursor: pointer;
      transition: border-color 180ms ease, color 180ms ease, background 180ms ease;
    }

    .small-actions button:hover {
      border-color: rgba(232, 204, 141, 0.6);
      background: rgba(232, 204, 141, 0.08);
      color: #fffaf0;
    }

    .submit-button {
      width: 100%;
      min-height: 50px;
      margin-top: 20px;
      border: 1px solid rgba(255, 235, 190, 0.55);
      border-radius: 12px;
      background: linear-gradient(110deg, #d8b76a, #f4dfa5 48%, #c99d4b);
      color: #17131a;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 0 22px rgba(232, 204, 141, 0.17);
      transition: transform 160ms ease, box-shadow 180ms ease, filter 180ms ease;
    }

    .submit-button:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
      box-shadow: 0 0 30px rgba(232, 204, 141, 0.32);
    }

    .submit-button:active {
      transform: translateY(1px);
    }

    #password-message {
      min-height: 22px;
      margin: 12px 0 0;
      color: #ff9a9a;
      font-size: 13px;
      line-height: 1.5;
    }

    .password-deadline {
      display: block;
      margin-top: 13px;
      color: #a7a8b5;
      font-size: 11px;
      line-height: 1.5;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div id="rotate-device-warning">
    <div class="warning-content">
      <svg
        width="64"
        height="64"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        style="animation: rotateAnim 2s infinite ease-in-out;"
      >
        <path d="M4 5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5z"></path>
        <path d="M10 12h4m-2-2v4"></path>
      </svg>
      <h2>Vui lòng xoay ngang màn hình</h2>
      <p>Trải nghiệm tốt nhất khi sử dụng chế độ ngang trên thiết bị di động.</p>
    </div>
  </div>

  <div id="password-gate" role="dialog" aria-modal="true" aria-labelledby="password-title">
    <div class="password-card">
      <div class="lock-emblem" aria-hidden="true">🔐</div>
      <p class="eyebrow">A private moment</p>
      <h2 id="password-title">Cánh Cổng Bí Mật</h2>
      <p class="intro">Một khoảnh khắc nhỏ đang chờ bạn phía sau cánh cổng này.</p>

      <form id="password-form">
        <label for="password-input">Mật khẩu</label>
        <div class="password-input-wrap">
          <input
            id="password-input"
            type="password"
            autocomplete="off"
            placeholder="Nhập mật khẩu..."
            aria-describedby="password-message"
            required
          >
        </div>

        <div class="small-actions">
          <button type="button" id="toggle-password">Hiện mật khẩu</button>
          <button type="button" id="clear-password">Xóa</button>
        </div>

        <button class="submit-button" type="submit">MỞ CÁNH CỔNG ✨</button>
        <p id="password-message" aria-live="polite"></p>
      </form>

      <small class="password-deadline">
        Cổng sẽ tự mở lúc 12:00 trưa ngày 20/11/2026.
      </small>
    </div>
  </div>
</div>

<div id="start-screen" hidden>
  <div class="start-card">
    <img class="start-image" src="./img/start-book.png" alt="">
    <button id="start-button" type="button">Chạm để bắt đầu</button>
  </div>
</div>

  <main class="page-content" id="page-content" hidden>
    <div class="card">
      <h1>Trang demo của tôi</h1>
      <p>Đây là trang web đầu tiên của tôi.</p>

      <video controls>
        <source src="./video/vid%201.mp4" type="video/mp4">
        Trình duyệt của bạn không hỗ trợ video.
      </video>

      <video controls>
        <source src="./video/vid%202.mp4" type="video/mp4">
        Trình duyệt của bạn không hỗ trợ video.
      </video>
    </div>
  </main>

  <script src="./Javascript/password-gate.js"></script>
</body>
</html>
